services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      CORS_ORIGIN: "https://karlfredenhagen.github.io"
      DATA_DIR: "/data"
    volumes:
      - rangbestie-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  rangbestie-data:
  caddy-data:
  caddy-config:
