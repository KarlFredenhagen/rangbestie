services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      CORS_ORIGIN: "https://karlfredenhagen.github.io"
      DATA_DIR: "/data"
    volumes:
      - rangbestie-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Meldet alle 5 Minuten die aktuelle oeffentliche IP an DuckDNS, damit
  # <subdomain>.duckdns.org immer auf den richtigen Server zeigt (z.B. wenn
  # dein Internetanbieter keine feste IP vergibt). tischtennis.oxibuff.at
  # zeigt per CNAME auf diese DuckDNS-Domain.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      TZ: "Europe/Vienna"
      SUBDOMAINS: "${DUCKDNS_SUBDOMAIN}"
      TOKEN: "${DUCKDNS_TOKEN}"

volumes:
  rangbestie-data:
  caddy-data:
  caddy-config:
